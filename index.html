<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <title>MrShop: Night Drop Mobile</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #04060a;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: Arial, Helvetica, sans-serif;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    let W = 0;
    let H = 0;
    let dpr = 1;
    let unit = 0;
    let speedScale = 1;

    let state = "menu";
    let levelIndex = 0;
    let stateTime = 0;

    let suspicion = 0;
    let message = "";
    let messageTimer = 0;

    let interactPressed = false;

    let dashTime = 0;
    let dashCooldown = 0;

    let shakeTime = 0;
    let shakePower = 0;

    let bgTime = 0;

    const keys = {};

    let orders = [];
    let police = [];
    let particles = [];
    let trail = [];
    let rain = [];

    const player = {
      x: 100,
      y: 100,
      r: 14,
      speed: 230,
      carrying: false,
      currentOrder: 0
    };

    const joystick = {
      active: false,
      id: null,
      baseX: 0,
      baseY: 0,
      thumbX: 0,
      thumbY: 0,
      dx: 0,
      dy: 0,
      r: 60
    };

    const controls = {
      action: {
        x: 0,
        y: 0,
        r: 52,
        pressed: false,
        id: null
      },
      dash: {
        x: 0,
        y: 0,
        r: 44,
        pressed: false,
        id: null
      }
    };

    const LEVELS = [
      {
        name: "Livello 1 - Tutorial",
        intro: "MrChat: Primo pacco. Usa joystick e tasto E.",
        player: { x: 0.08, y: 0.82 },
        orders: [
          {
            pickup: { x: 0.22, y: 0.25 },
            drop: { x: 0.78, y: 0.72 }
          }
        ],
        police: [
          {
            path: [
              { x: 0.5, y: 0.22 },
              { x: 0.5, y: 0.78 }
            ],
            speed: 65,
            range: 0.26,
            fov: Math.PI / 3
          }
        ]
      },
      {
        name: "Livello 2 - Periferia",
        intro: "MrChat: Due consegne. Evita i coni rossi.",
        player: { x: 0.08, y: 0.5 },
        orders: [
          {
            pickup: { x: 0.18, y: 0.2 },
            drop: { x: 0.82, y: 0.2 }
          },
          {
            pickup: { x: 0.18, y: 0.8 },
            drop: { x: 0.82, y: 0.8 }
          }
        ],
        police: [
          {
            path: [
              { x: 0.5, y: 0.15 },
              { x: 0.5, y: 0.85 }
            ],
            speed: 80,
            range: 0.28,
            fov: Math.PI / 3
          },
          {
            path: [
              { x: 0.3, y: 0.5 },
              { x: 0.7, y: 0.5 }
            ],
            speed: 70,
            range: 0.24,
            fov: Math.PI / 2.6
          }
        ]
      },
      {
        name: "Livello 3 - Zona Nord",
        intro: "MrChat: Usa lo SCATTO con attenzione.",
        player: { x: 0.5, y: 0.88 },
        orders: [
          {
            pickup: { x: 0.14, y: 0.3 },
            drop: { x: 0.86, y: 0.3 }
          },
          {
            pickup: { x: 0.14, y: 0.62 },
            drop: { x: 0.86, y: 0.62 }
          }
        ],
        police: [
          {
            path: [
              { x: 0.28, y: 0.2 },
              { x: 0.72, y: 0.2 },
              { x: 0.72, y: 0.42 },
              { x: 0.28, y: 0.42 }
            ],
            speed: 90,
            range: 0.28,
            fov: Math.PI / 3.2
          },
          {
            path: [
              { x: 0.28, y: 0.56 },
              { x: 0.72, y: 0.56 },
              { x: 0.72, y: 0.78 },
              { x: 0.28, y: 0.78 }
            ],
            speed: 90,
            range: 0.28,
            fov: Math.PI / 3.2
          },
          {
            path: [
              { x: 0.5, y: 0.16 },
              { x: 0.5, y: 0.84 }
            ],
            speed: 65,
            range: 0.24,
            fov: Math.PI / 2.8
          }
        ]
      },
      {
        name: "Livello 4 - Centro",
        intro: "MrChat: Tre ordini. Città sorvegliata.",
        player: { x: 0.06, y: 0.12 },
        orders: [
          {
            pickup: { x: 0.2, y: 0.78 },
            drop: { x: 0.8, y: 0.22 }
          },
          {
            pickup: { x: 0.8, y: 0.78 },
            drop: { x: 0.2, y: 0.22 }
          },
          {
            pickup: { x: 0.5, y: 0.5 },
            drop: { x: 0.9, y: 0.5 }
          }
        ],
        police: [
          {
            path: [
              { x: 0.25, y: 0.5 },
              { x: 0.75, y: 0.5 }
            ],
            speed: 95,
            range: 0.28,
            fov: Math.PI / 3
          },
          {
            path: [
              { x: 0.5, y: 0.22 },
              { x: 0.5, y: 0.78 }
            ],
            speed: 75,
            range: 0.26,
            fov: Math.PI / 3
          },
          {
            path: [
              { x: 0.2, y: 0.3 },
              { x: 0.8, y: 0.3 },
              { x: 0.8, y: 0.68 },
              { x: 0.2, y: 0.68 }
            ],
            speed: 85,
            range: 0.27,
            fov: Math.PI / 3.4
          }
        ]
      },
      {
        name: "Livello 5 - Ultima corsa",
        intro: "MrChat: Ultima corsa. Fai la tua scelta.",
        player: { x: 0.5, y: 0.12 },
        orders: [
          {
            pickup: { x: 0.12, y: 0.22 },
            drop: { x: 0.88, y: 0.78 }
          },
          {
            pickup: { x: 0.88, y: 0.22 },
            drop: { x: 0.12, y: 0.78 }
          },
          {
            pickup: { x: 0.5, y: 0.5 },
            drop: { x: 0.5, y: 0.85 }
          }
        ],
        police: [
          {
            path: [
              { x: 0.24, y: 0.22 },
              { x: 0.76, y: 0.22 },
              { x: 0.76, y: 0.78 },
              { x: 0.24, y: 0.78 }
            ],
            speed: 105,
            range: 0.29,
            fov: Math.PI / 3.2
          },
          {
            path: [
              { x: 0.5, y: 0.3 },
              { x: 0.5, y: 0.68 }
            ],
            speed: 80,
            range: 0.26,
            fov: Math.PI / 2.8
          },
          {
            path: [
              { x: 0.12, y: 0.5 },
              { x: 0.88, y: 0.5 }
            ],
            speed: 95,
            range: 0.27,
            fov: Math.PI / 3.2
          },
          {
            path: [
              { x: 0.32, y: 0.78 },
              { x: 0.68, y: 0.78 }
            ],
            speed: 88,
            range: 0.23,
            fov: Math.PI / 2.6
          }
        ]
      }
    ];

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function nearPoint(a, b, radius = 42) {
      return distance(a, b) <= radius;
    }

    function normalizeAngle(angle) {
      while (angle > Math.PI) angle -= Math.PI * 2;
      while (angle < -Math.PI) angle += Math.PI * 2;
      return angle;
    }

    function setState(newState) {
      state = newState;
      stateTime = 0;

      if (state !== "playing") {
        joystick.active = false;
        joystick.dx = 0;
        joystick.dy = 0;
        joystick.thumbX = 0;
        joystick.thumbY = 0;
      }
    }

    function setMessage(text, seconds = 3.5) {
      message = text;
      messageTimer = seconds;
    }

    function getPoint(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
      };
    }

    function inCircle(point, circle, radiusBoost = 1) {
      return distance(point, circle) <= circle.r * radiusBoost;
    }

    let audioCtx = null;

    function initAudio() {
      try {
        if (!audioCtx) {
          const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

          if (AudioContextClass) {
            audioCtx = new AudioContextClass();
          }
        }

        if (audioCtx && audioCtx.state === "suspended") {
          audioCtx.resume();
        }
      } catch (err) {
        // audio non disponibile
      }
    }

    function playTone(freq = 440, duration = 0.08, type = "sine", volume = 0.04) {
      if (!audioCtx) return;

      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = type;
        osc.frequency.value = freq;

        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (err) {
        // niente audio
      }
    }

    function layoutControls() {
      joystick.r = clamp(unit * 0.09, 48, 74);

      controls.action.r = clamp(unit * 0.08, 42, 60);
      controls.dash.r = clamp(unit * 0.068, 36, 52);

      const bottomSafe = Math.max(20, H * 0.045);

      controls.action.x = W - controls.action.r - 22;
      controls.action.y = H - controls.action.r - bottomSafe - 12;

      controls.dash.x = W - controls.dash.r - 30;
      controls.dash.y =
        controls.action.y -
        controls.action.r -
        controls.dash.r -
        26;
    }

    function initRain() {
      const count = Math.floor(Math.min(110, (W * H) / 22000));

      rain = Array.from({ length: count }, () => ({
        x: Math.random() * W,
        y: Math.random() * H,
        speed: 280 + Math.random() * 380,
        wind: -40 - Math.random() * 70,
        len: 10 + Math.random() * 18
      }));
    }

    function resizeCanvas() {
      dpr = Math.min(window.devicePixelRatio || 1, 3);

      W = window.innerWidth;
      H = window.innerHeight;

      canvas.width = Math.floor(W * dpr);
      canvas.height = Math.floor(H * dpr);

      canvas.style.width = W + "px";
      canvas.style.height = H + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      unit = Math.min(W, H);

      speedScale = clamp(unit / 540, 0.9, 1.45);

      player.r = clamp(unit * 0.032, 11, 18);
      player.speed = clamp(230 * speedScale, 190, 340);

      layoutControls();
      initRain();
    }

    function toScreen(p) {
      const top = Math.max(72, H * 0.12);
      const bottom = Math.max(120, H * 0.22);
      const side = Math.max(24, W * 0.04);

      const usableW = Math.max(10, W - side * 2);
      const usableH = Math.max(10, H - top - bottom);

      return {
        x: side + p.x * usableW,
        y: top + p.y * usableH
      };
    }

    function loadLevel(index) {
      levelIndex = index;

      const level = LEVELS[index];

      suspicion = 0;
      dashTime = 0;
      dashCooldown = 0;
      shakeTime = 0;
      shakePower = 0;

      particles = [];
      trail = [];

      const start = toScreen(level.player);

      player.x = start.x;
      player.y = start.y;
      player.carrying = false;
      player.currentOrder = 0;

      orders = level.orders.map(order => ({
        pickup: toScreen(order.pickup),
        drop: toScreen(order.drop)
      }));

      police = level.police.map(p => {
        const startPath = toScreen(p.path[0]);

        return {
          path: p.path.map(point => toScreen(point)),
          speed: p.speed * speedScale,
          range: Math.max(110, p.range * unit),
          fov: p.fov,
          x: startPath.x,
          y: startPath.y,
          waypoint: 1,
          angle: 0,
          seePlayer: false
        };
      });

      setState("playing");
      setMessage(level.intro, 4.5);
      playTone(360, 0.06, "sine", 0.03);
    }

    function reloadCurrentLevelPreserve() {
      if (state !== "playing") return;

      const savedOrder = player.currentOrder;
      const savedCarrying = player.carrying;

      loadLevel(levelIndex);

      player.currentOrder = Math.min(savedOrder, orders.length - 1);
      player.carrying = savedCarrying && Boolean(orders[player.currentOrder]);

      setMessage("Schermo adattato.");
    }

    function advance() {
      if (state === "menu") {
        loadLevel(0);
      } else if (state === "caught") {
        loadLevel(levelIndex);
      } else if (state === "levelComplete") {
        loadLevel(levelIndex + 1);
      } else if (state === "win") {
        setState("menu");
      }
    }

    function startJoystick(point, pointerId) {
      joystick.active = true;
      joystick.id = pointerId;
      joystick.baseX = point.x;
      joystick.baseY = point.y;
      joystick.thumbX = 0;
      joystick.thumbY = 0;
      joystick.dx = 0;
      joystick.dy = 0;
    }

    function updateJoystick(point) {
      let dx = point.x - joystick.baseX;
      let dy = point.y - joystick.baseY;

      const dist = Math.hypot(dx, dy);
      const max = joystick.r;

      if (dist > max) {
        dx = (dx / dist) * max;
        dy = (dy / dist) * max;
      }

      joystick.thumbX = dx;
      joystick.thumbY = dy;
      joystick.dx = dx / max;
      joystick.dy = dy / max;
    }

    function triggerDash() {
      if (state !== "playing") return;
      if (dashCooldown > 0 || dashTime > 0) return;

      dashTime = 0.27;
      dashCooldown = 2.5;

      playTone(220, 0.09, "sawtooth", 0.05);
      spawnParticles(player.x, player.y, "#7fd6ff", 18, 170);
    }

    function addShake(power, time) {
      shakePower = power;
      shakeTime = time;
    }

    function spawnParticles(x, y, color, count = 16, speed = 160) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const s = speed * (0.35 + Math.random() * 0.9);

        particles.push({
          x,
          y,
          vx: Math.cos(angle) * s,
          vy: Math.sin(angle) * s,
          life: 0.35 + Math.random() * 0.5,
          max: 0.85,
          size: 1.5 + Math.random() * 3.5,
          color
        });
      }
    }

    canvas.addEventListener(
      "pointerdown",
      e => {
        e.preventDefault();
        initAudio();

        const point = getPoint(e);

        try {
          canvas.setPointerCapture(e.pointerId);
        } catch (err) {
          // niente capture
        }

        if (state !== "playing") {
          if (stateTime > 0.3) {
            playTone(420, 0.05, "sine", 0.03);
            advance();
          }
          return;
        }

        if (inCircle(point, controls.dash, 1.18)) {
          controls.dash.pressed = true;
          controls.dash.id = e.pointerId;
          triggerDash();
          return;
        }

        if (inCircle(point, controls.action, 1.18)) {
          controls.action.pressed = true;
          controls.action.id = e.pointerId;
          interactPressed = true;
          return;
        }

        if (point.x < W * 0.62 && !joystick.active) {
          startJoystick(point, e.pointerId);
          return;
        }

        if (point.x > W * 0.55) {
          interactPressed = true;
        }
      },
      { passive: false }
    );

    window.addEventListener(
      "pointermove",
      e => {
        if (state !== "playing") return;

        const point = getPoint(e);

        if (joystick.active && e.pointerId === joystick.id) {
          updateJoystick(point);
        }

        if (e.pointerId === controls.action.id) {
          controls.action.pressed = inCircle(point, controls.action, 1.35);
        }

        if (e.pointerId === controls.dash.id) {
          controls.dash.pressed = inCircle(point, controls.dash, 1.35);
        }
      },
      { passive: true }
    );

    function endPointer(e) {
      if (e.pointerId === joystick.id) {
        joystick.active = false;
        joystick.dx = 0;
        joystick.dy = 0;
        joystick.thumbX = 0;
        joystick.thumbY = 0;
      }

      if (e.pointerId === controls.action.id) {
        controls.action.pressed = false;
      }

      if (e.pointerId === controls.dash.id) {
        controls.dash.pressed = false;
      }
    }

    window.addEventListener("pointerup", endPointer);
    window.addEventListener("pointercancel", endPointer);

    window.addEventListener("contextmenu", e => e.preventDefault());

    window.addEventListener("keydown", e => {
      const key = e.key.toLowerCase();

      if (
        ["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(key)
      ) {
        e.preventDefault();
      }

      keys[key] = true;

      initAudio();

      if (key === "e") {
        interactPressed = true;
      }

      if (key === " ") {
        triggerDash();
      }

      if (key === "enter" && state !== "playing" && stateTime > 0.25) {
        advance();
      }
    });

    window.addEventListener("keyup", e => {
      keys[e.key.toLowerCase()] = false;
    });

    function updatePlayer(dt) {
      let dx = 0;
      let dy = 0;

      const joyMag = Math.hypot(joystick.dx, joystick.dy);

      if (joystick.active && joyMag > 0.14) {
        dx = joystick.dx;
        dy = joystick.dy;
      } else {
        if (keys["arrowup"] || keys["w"]) dy -= 1;
        if (keys["arrowdown"] || keys["s"]) dy += 1;
        if (keys["arrowleft"] || keys["a"]) dx -= 1;
        if (keys["arrowright"] || keys["d"]) dx += 1;
      }

      const moveMag = Math.hypot(dx, dy);

      if (moveMag > 1) {
        dx /= moveMag;
        dy /= moveMag;
      }

      const dashMultiplier = dashTime > 0 ? 1.85 : 1;

      if (moveMag > 0.01) {
        player.x += dx * player.speed * dashMultiplier * dt * Math.min(1, moveMag);
        player.y += dy * player.speed * dashMultiplier * dt * Math.min(1, moveMag);

        trail.push({
          x: player.x,
          y: player.y,
          life: 0.32,
          max: 0.32
        });

        if (trail.length > 34) {
          trail.shift();
        }

        if (dashTime > 0 && Math.random() < 0.45) {
          spawnParticles(player.x, player.y, "#7fd6ff", 1, 45);
        }
      }

      player.x = clamp(player.x, player.r, W - player.r);
      player.y = clamp(player.y, Math.max(74, player.r), H - player.r);

      const order = orders[player.currentOrder];

      if (interactPressed && order) {
        const radius = Math.max(46, unit * 0.095);

        if (!player.carrying && nearPoint(player, order.pickup, radius)) {
          player.carrying = true;
          setMessage("Pacco ritirato. Vai al punto verde.");
          playTone(520, 0.08, "triangle", 0.05);
          spawnParticles(order.pickup.x, order.pickup.y, "#ffd166", 26, 180);
        } else if (player.carrying && nearPoint(player, order.drop, radius)) {
          player.carrying = false;
          player.currentOrder++;

          playTone(720, 0.1, "triangle", 0.06);
          spawnParticles(order.drop.x, order.drop.y, "#7cff9d", 30, 200);

          if (player.currentOrder >= orders.length) {
            if (levelIndex >= LEVELS.length - 1) {
              setState("win");
            } else {
              setState("levelComplete");
            }

            playTone(880, 0.12, "triangle", 0.07);
          } else {
            setMessage("MrChat: nuovo ordine disponibile.");
          }
        }
      }

      interactPressed = false;
    }

    function updatePolice(dt) {
      let seen = false;

      for (const p of police) {
        const target = p.path[p.waypoint];

        const dx = target.x - p.x;
        const dy = target.y - p.y;
        const dist = Math.hypot(dx, dy);

        if (dist < 6) {
          p.waypoint = (p.waypoint + 1) % p.path.length;
        } else {
          const step = p.speed * dt;

          if (step >= dist) {
            p.x = target.x;
            p.y = target.y;
          } else {
            p.x += (dx / dist) * step;
            p.y += (dy / dist) * step;
          }

          p.angle = Math.atan2(dy, dx);
        }

        p.seePlayer = false;

        const distToPlayer = distance(p, player);

        if (distToPlayer <= p.range) {
          const angleToPlayer = Math.atan2(player.y - p.y, player.x - p.x);
          const diff = Math.abs(normalizeAngle(angleToPlayer - p.angle));

          if (diff <= p.fov / 2) {
            p.seePlayer = true;
            seen = true;
          }
        }
      }

      if (seen) {
        suspicion += (68 + levelIndex * 6 + (dashTime > 0 ? 24 : 0)) * dt;

        if (Math.random() < 0.18) {
          spawnParticles(player.x, player.y, "#ff6b6b", 1, 40);
        }
      } else {
        suspicion = Math.max(0, suspicion - 44 * dt);
      }

      suspicion = Math.min(100, suspicion);

      if (suspicion >= 100) {
        setState("caught");
        playTone(110, 0.25, "sawtooth", 0.08);
        addShake(16, 0.55);
        spawnParticles(player.x, player.y, "#ff5d5d", 60, 260);
      }
    }

    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];

        p.life -= dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;

        p.vx *= 0.98;
        p.vy *= 0.98;

        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    function updateTrail(dt) {
      for (let i = trail.length - 1; i >= 0; i--) {
        trail[i].life -= dt;

        if (trail[i].life <= 0) {
          trail.splice(i, 1);
        }
      }
    }

    function updateRain(dt) {
      for (const drop of rain) {
        drop.y += drop.speed * dt;
        drop.x += drop.wind * dt;

        if (drop.y > H + 30) {
          drop.y = -30;
          drop.x = Math.random() * W;
        }

        if (drop.x < -30) {
          drop.x = W + 20;
        }
      }
    }

    function roundRect(x, y, w, h, r) {
      r = Math.min(r, w / 2, h / 2);

      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function drawBackground() {
      const gradient = ctx.createLinearGradient(0, 0, 0, H);

      gradient.addColorStop(0, "#0a1326");
      gradient.addColorStop(0.55, "#070b14");
      gradient.addColorStop(1, "#04060a");

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, W, H);

      const grid = Math.max(46, unit / 10);
      const offset = (bgTime * 18) % grid;

      ctx.strokeStyle = "rgba(110,170,255,0.06)";
      ctx.lineWidth = 1;
      ctx.beginPath();

      for (let x = -grid + offset; x < W; x += grid) {
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
      }

      for (let y = -grid + offset; y < H; y += grid) {
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
      }

      ctx.stroke();

      const vignette = ctx.createRadialGradient(
        W / 2,
        H / 2,
        unit * 0.18,
        W / 2,
        H / 2,
        Math.max(W, H) * 0.78
      );

      vignette.addColorStop(0, "rgba(0,0,0,0)");
      vignette.addColorStop(1, "rgba(0,0,0,0.45)");

      ctx.fillStyle = vignette;
      ctx.fillRect(0, 0, W, H);
    }

    function drawRain() {
      ctx.save();

      ctx.strokeStyle = "rgba(170,220,255,0.10)";
      ctx.lineWidth = 1;
      ctx.beginPath();

      for (const drop of rain) {
        ctx.moveTo(drop.x, drop.y);
        ctx.lineTo(drop.x + drop.wind * 0.04, drop.y + drop.len);
      }

      ctx.stroke();

      ctx.restore();
    }

    function drawTrail() {
      for (const t of trail) {
        const alpha = t.life / t.max;

        ctx.beginPath();
        ctx.arc(t.x, t.y, player.r * alpha * 0.75, 0, Math.PI * 2);

        ctx.fillStyle = player.carrying
          ? `rgba(255,209,102,${alpha * 0.22})`
          : `rgba(141,240,255,${alpha * 0.18})`;

        ctx.fill();
      }
    }

    function drawMarker(point, color, label) {
      const pulse = 6 + Math.sin(performance.now() / 170) * 3;

      ctx.save();

      ctx.shadowColor = color;
      ctx.shadowBlur = 25;

      ctx.beginPath();
      ctx.arc(point.x, point.y, 16 + pulse, 0, Math.PI * 2);
      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(point.x, point.y, 8, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();

      ctx.shadowBlur = 0;

      ctx.fillStyle = "#05070a";
      ctx.font = `bold ${Math.max(11, unit * 0.022)}px sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("E", point.x, point.y);

      ctx.fillStyle = color;
      ctx.font = `bold ${Math.max(13, unit * 0.025)}px sans-serif`;
      ctx.fillText(label, point.x, point.y - 38);

      ctx.restore();
    }

    function drawPolice() {
      for (const p of police) {
        const base = p.seePlayer ? "255,70,70" : "255,140,80";

        const coneGradient = ctx.createRadialGradient(
          p.x,
          p.y,
          0,
          p.x,
          p.y,
          p.range
        );

        coneGradient.addColorStop(0, `rgba(${base},0.30)`);
        coneGradient.addColorStop(1, `rgba(${base},0)`);

        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.arc(p.x, p.y, p.range, p.angle - p.fov / 2, p.angle + p.fov / 2);
        ctx.closePath();

        ctx.fillStyle = coneGradient;
        ctx.fill();

        const bodyRadius = Math.max(11, unit * 0.022);

        ctx.save();

        ctx.shadowColor = "#7fb4ff";
        ctx.shadowBlur = 18;

        ctx.beginPath();
        ctx.arc(p.x, p.y, bodyRadius, 0, Math.PI * 2);
        ctx.fillStyle = "#7fb4ff";
        ctx.fill();

        ctx.restore();

        const blink = Math.sin(performance.now() / 120 + p.x) > 0;

        ctx.beginPath();
        ctx.arc(p.x, p.y - bodyRadius * 0.55, bodyRadius * 0.28, 0, Math.PI * 2);
        ctx.fillStyle = blink ? "#ff5d5d" : "#5d8bff";
        ctx.fill();
      }
    }

    function drawPlayer() {
      ctx.save();

      const color = player.carrying ? "#ffd166" : "#8df0ff";

      ctx.shadowColor = color;
      ctx.shadowBlur = 22;

      ctx.beginPath();
      ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();

      ctx.restore();

      if (player.carrying) {
        ctx.fillStyle = "#271500";
        ctx.font = `bold ${Math.max(9, player.r * 0.62)}px sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("BOX", player.x, player.y);
      }
    }

    function drawParticles() {
      ctx.save();

      for (const p of particles) {
        const alpha = p.life / p.max;

        ctx.globalAlpha = Math.max(0, alpha);
        ctx.fillStyle = p.color;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function drawHUD() {
      if (state === "menu") return;

      const pad = 12;
      const narrow = W < 640;
      const barH = narrow ? 96 : 68;

      ctx.save();

      ctx.fillStyle = "rgba(4,8,16,0.48)";
      roundRect(pad, pad, W - pad * 2, barH, 18);
      ctx.fill();

      ctx.strokeStyle = "rgba(140,200,255,0.16)";
      ctx.lineWidth = 2;
      roundRect(pad, pad, W - pad * 2, barH, 18);
      ctx.stroke();

      ctx.textAlign = "left";
      ctx.textBaseline = "top";

      ctx.fillStyle = "#f2f5ff";
      ctx.font = `bold ${clamp(unit * 0.035, 16, 24)}px sans-serif`;
      ctx.fillText(LEVELS[levelIndex].name, pad + 16, pad + 10);

      const order = orders[player.currentOrder];

      let objective = "Completa le consegne.";

      if (order) {
        objective = player.carrying
          ? "Vai al punto verde e premi E"
          : "Vai al punto giallo e premi E";
      }

      ctx.font = `${clamp(unit * 0.028, 13, 18)}px sans-serif`;
      ctx.fillStyle = "#b8c4dd";
      ctx.fillText(objective, pad + 16, pad + (narrow ? 38 : 40));

      const suspicionBarW = narrow
        ? W - pad * 2 - 32
        : Math.min(280, W * 0.35);

      const suspicionBarH = 14;

      const sx = narrow
        ? pad + 16
        : W - pad - suspicionBarW - 16;

      const sy = narrow
        ? pad + 66
        : pad + 14;

      ctx.fillStyle = "#182238";
      roundRect(sx, sy, suspicionBarW, suspicionBarH, 7);
      ctx.fill();

      const value = suspicion / 100;

      if (value > 0) {
        ctx.fillStyle =
          suspicion > 70
            ? "#ff5d5d"
            : suspicion > 35
              ? "#ffb45d"
              : "#5dff8f";

        roundRect(sx, sy, Math.max(10, suspicionBarW * value), suspicionBarH, 7);
        ctx.fill();
      }

      ctx.font = "12px sans-serif";
      ctx.fillStyle = "#dfe8ff";
      ctx.textAlign = narrow ? "left" : "right";
      ctx.fillText("SOSPETTO", sx + suspicionBarW, sy + 20);

      if (messageTimer > 0) {
        const msgW = Math.min(W - 32, 560);
        const msgX = (W - msgW) / 2;
        const msgY = pad + barH + 12;

        ctx.fillStyle = "rgba(7,14,25,0.88)";
        roundRect(msgX, msgY, msgW, 44, 12);
        ctx.fill();

        ctx.strokeStyle = "rgba(130,210,255,0.35)";
        roundRect(msgX, msgY, msgW, 44, 12);
        ctx.stroke();

        ctx.fillStyle = "#aee6ff";
        ctx.font = `${clamp(unit * 0.028, 13, 17)}px sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(message, W / 2, msgY + 22);
      }

      ctx.restore();
    }

    function drawCircleButton(btn, label, color, enabled, pressed, subLabel = "") {
      ctx.save();

      ctx.globalAlpha = enabled ? 1 : 0.45;

      ctx.beginPath();
      ctx.arc(btn.x, btn.y, btn.r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(8,14,26,0.72)";
      ctx.fill();

      if (pressed) {
        ctx.save();
        ctx.globalAlpha = 0.28;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(btn.x, btn.y, btn.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      ctx.lineWidth = 3;
      ctx.strokeStyle = color;
      ctx.stroke();

      ctx.fillStyle = color;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      ctx.font = `bold ${Math.max(14, btn.r * 0.38)}px sans-serif`;
      ctx.fillText(label, btn.x, btn.y - (subLabel ? btn.r * 0.22 : 0));

      if (subLabel) {
        ctx.font = `bold ${Math.max(10, btn.r * 0.2)}px sans-serif`;
        ctx.fillText(subLabel, btn.x, btn.y + btn.r * 0.38);
      }

      ctx.restore();
    }

    function drawControls() {
      if (state !== "playing") return;

      ctx.save();

      if (!joystick.active) {
        const hintX = Math.max(90, W * 0.16);
        const hintY = H - Math.max(110, H * 0.18);

        ctx.globalAlpha = 0.24;

        ctx.beginPath();
        ctx.arc(hintX, hintY, joystick.r, 0, Math.PI * 2);
        ctx.strokeStyle = "#9fd7ff";
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(hintX, hintY, joystick.r * 0.45, 0, Math.PI * 2);
        ctx.fillStyle = "#9fd7ff";
        ctx.fill();

        ctx.globalAlpha = 1;

        ctx.fillStyle = "#9fd7ff";
        ctx.font = `${clamp(unit * 0.024, 11, 14)}px sans-serif`;
        ctx.textAlign = "center";
        ctx.fillText("MUOVI", hintX, hintY + joystick.r + 22);
      } else {
        ctx.globalAlpha = 0.3;

        ctx.beginPath();
        ctx.arc(joystick.baseX, joystick.baseY, joystick.r, 0, Math.PI * 2);
        ctx.strokeStyle = "#9fd7ff";
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(
          joystick.baseX + joystick.thumbX,
          joystick.baseY + joystick.thumbY,
          joystick.r * 0.42,
          0,
          Math.PI * 2
        );

        ctx.fillStyle = "#9fd7ff";
        ctx.fill();

        ctx.globalAlpha = 1;
      }

      drawCircleButton(
        controls.action,
        "E",
        player.carrying ? "#7cff9d" : "#ffd166",
        true,
        controls.action.pressed,
        player.carrying ? "CONSEGNA" : "RITIRA"
      );

      drawCircleButton(
        controls.dash,
        "SCATTO",
        "#7fd6ff",
        dashCooldown <= 0,
        controls.dash.pressed
      );

      if (dashCooldown > 0) {
        const progress = 1 - dashCooldown / 2.5;

        ctx.beginPath();
        ctx.moveTo(controls.dash.x, controls.dash.y);
        ctx.arc(
          controls.dash.x,
          controls.dash.y,
          controls.dash.r + 4,
          -Math.PI / 2,
          -Math.PI / 2 + Math.PI * 2 * progress
        );
        ctx.closePath();

        ctx.fillStyle = "rgba(127,214,255,0.25)";
        ctx.fill();
      }

      ctx.restore();
    }

    function drawOverlay(title, lines, cta, accent = "#7fd6ff") {
      ctx.save();

      ctx.fillStyle = "rgba(2,4,8,0.8)";
      ctx.fillRect(0, 0, W, H);

      const panelW = Math.min(W * 0.92, 700);

      const titleSize = clamp(unit * 0.07, 28, 54);
      const lineSize = clamp(unit * 0.034, 15, 22);
      const lineHeight = lineSize * 1.45;

      const panelH = Math.min(
        H * 0.88,
        titleSize + lines.length * lineHeight + 180
      );

      const x = (W - panelW) / 2;
      const y = (H - panelH) / 2;

      ctx.fillStyle = "rgba(8,14,26,0.92)";
      roundRect(x, y, panelW, panelH, 24);
      ctx.fill();

      ctx.strokeStyle = "rgba(140,210,255,0.22)";
      ctx.lineWidth = 2;
      roundRect(x, y, panelW, panelH, 24);
      ctx.stroke();

      ctx.textAlign = "center";
      ctx.textBaseline = "top";

      ctx.fillStyle = "#f2f5ff";
      ctx.font = `bold ${titleSize}px sans-serif`;
      ctx.fillText(title, W / 2, y + 24);

      ctx.font = `${lineSize}px sans-serif`;
      ctx.fillStyle = "#c4cfec";

      lines.forEach((line, index) => {
        ctx.fillText(line, W / 2, y + 24 + titleSize + 18 + index * lineHeight);
      });

      const ctaW = Math.min(panelW * 0.72, 340);
      const ctaH = Math.max(50, unit * 0.09);
      const ctaX = W / 2 - ctaW / 2;
      const ctaY = y + panelH - ctaH - 24;

      const pulse = 0.85 + Math.sin(stateTime * 4) * 0.15;

      ctx.globalAlpha = pulse;

      ctx.fillStyle = accent;
      roundRect(ctaX, ctaY, ctaW, ctaH, ctaH / 2);
      ctx.fill();

      ctx.globalAlpha = 1;

      ctx.fillStyle = "#04101f";
      ctx.font = `bold ${clamp(ctaH * 0.42, 16, 24)}px sans-serif`;
      ctx.textBaseline = "middle";
      ctx.fillText(cta, W / 2, ctaY + ctaH / 2 + 1);

      ctx.restore();
    }

    function drawMenu() {
      drawOverlay(
        "MrShop: Night Drop",
        [
          "Versione fictional: pacchi misteriosi, nessuna istruzione reale.",
          "Joystick sinistro per muoverti.",
          "Pulsante destro per ritirare e consegnare.",
          "SCATTO ti rende più veloce, ma aumenti il sospetto se ti vedono."
        ],
        "TOCCA PER INIZIARE"
      );
    }

    function draw() {
      drawBackground();
      drawRain();

      if (state !== "menu") {
        ctx.save();

        if (shakeTime > 0) {
          const amount = shakePower * Math.min(1, shakeTime * 2);
          ctx.translate(
            (Math.random() - 0.5) * amount,
            (Math.random() - 0.5) * amount
          );
        }

        drawTrail();

        const order = orders[player.currentOrder];

        if (order) {
          if (!player.carrying) {
            drawMarker(order.pickup, "#ffd166", "RITIRO");
          } else {
            drawMarker(order.drop, "#7cff9d", "CONSEGNA");
          }
        }

        drawPolice();
        drawPlayer();
        drawParticles();

        ctx.restore();

        drawHUD();
        drawControls();
      }

      if (state === "menu") {
        drawMenu();
      } else if (state === "caught") {
        drawOverlay(
          "Sei stato fermato",
          [
            "La pattuglia ti ha notato troppo a lungo.",
            "Riprova usando coperture visive e scatto al momento giusto."
          ],
          "RIPROVA",
          "#ff7d7d"
        );
      } else if (state === "levelComplete") {
        drawOverlay(
          "Livello completato",
          [
            "Consegne completate.",
            "Preparati al prossimo giro."
          ],
          "CONTINUA",
          "#7cff9d"
        );
      } else if (state === "win") {
        drawOverlay(
          "Fine della demo",
          [
            "MrShop completa le ultime consegne",
            "e sceglie una strada più sicura.",
            "Grazie per aver giocato."
          ],
          "TORNA AL MENU",
          "#ffd166"
        );
      }
    }

    let last = performance.now();

    function frame(now) {
      const dt = Math.min((now - last) / 1000, 0.033);
      last = now;

      stateTime += dt;
      bgTime += dt;

      if (messageTimer > 0) messageTimer -= dt;
      if (dashTime > 0) dashTime -= dt;
      if (dashCooldown > 0) dashCooldown -= dt;
      if (shakeTime > 0) shakeTime -= dt;

      updateRain(dt);
      updateParticles(dt);
      updateTrail(dt);

      if (state === "playing") {
        updatePlayer(dt);

        if (state === "playing") {
          updatePolice(dt);
        }
      }

      draw();

      requestAnimationFrame(frame);
    }

    let initialResizeDone = false;
    let resizeTimer = null;

    function handleResize() {
      resizeCanvas();

      if (initialResizeDone) {
        clearTimeout(resizeTimer);

        resizeTimer = setTimeout(() => {
          if (state === "playing") {
            reloadCurrentLevelPreserve();
          }
        }, 250);
      }

      initialResizeDone = true;
    }

    window.addEventListener("resize", handleResize);
    window.addEventListener("orientationchange", handleResize);

    handleResize();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
